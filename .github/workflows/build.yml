name: Build mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build
        run: |
          set -e
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-8.8-bin.zip
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          for z in *.zip; do if [ -f "$z" ]; then unzip -oq "$z" -d project; fi; done
          dir=$(dirname "$(find . -name build.gradle | head -n 1)")
          [ -f "$dir/build.gradle" ] || { echo "No build.gradle found - upload the project zip or the project files"; exit 1; }
          (cd "$dir" && "$RUNNER_TEMP/gradle-8.8/bin/gradle" build --no-daemon)
          mkdir -p out
          find "$dir/build/libs" -name '*.jar' ! -name '*-sources.jar' -exec cp {} out/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: btth-heavenly-flames
          path: out/*.jar
