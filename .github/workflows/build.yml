name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and prepare
        run: |
          unzip -o btth-heavenly-flames-src.zip
          if [ -d btth-heavenly-flames-src ]; then
            cp -a btth-heavenly-flames-src/. .
            rm -rf btth-heavenly-flames-src
          fi
          ls -la
          ls -la gradlew || ls -la */gradlew || true

      - name: Build
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          elif [ -f btth-heavenly-flames-src/gradlew ]; then
            cd btth-heavenly-flames-src
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            echo "gradlew not found"
            find . -name gradlew
            exit 1
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: btth-heavenly-flames
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
