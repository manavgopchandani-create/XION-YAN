name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip source
        run: |
          unzip -o btth-heavenly-flames-src.zip
          if [ -d btth-heavenly-flames-src ]; then
            shopt -s dotglob
            mv btth-heavenly-flames-src/* .
            rmdir btth-heavenly-flames-src || true
          fi
          ls -la
          test -f gradlew

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: btth-heavenly-flames
          path: build/libs/*.jar
